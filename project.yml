name: LivePhotoConverter
options:
  bundleIdPrefix: com.yerarassyl
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  groupSortPosition: top
  postGenCommand: sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/g' LivePhotoConverter.xcodeproj/project.pbxproj || true

targets:
  LivePhotoConverter:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - "**/*.plist"
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_NAME: "LivePhotoConverter"
        PRODUCT_BUNDLE_IDENTIFIER: "com.yerarassyl.LivePhotoConverter"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "Sources/Info.plist"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
